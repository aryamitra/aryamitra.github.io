<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arya Mitra</title>
    <meta name="description" content="Arya Mitra: CS + Math at UMass Amherst. AI/ML, quant finance, and graphics.">
    <meta property="og:title" content="Arya Mitra">
    <meta property="og:description" content="CS + Math at UMass Amherst. AI/ML, quant finance, and graphics.">
    <meta property="og:type" content="website">
    <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/assets/css/style.css?v=a85150f9">
    <link rel="stylesheet" href="/assets/css/splash.css?v=7e026104">
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('splash-return')) {
            document.documentElement.classList.add('splash-returning');
          }
        } catch (e) {}
        try {
          if (localStorage.getItem('portfolio-theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
</head>
<body class="splash">

    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
      <svg class="theme-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 3A9 9 0 0 0 12 21Z" fill="currentColor"/>
      </svg>
    </button>

    <main class="splash-main">
        <div class="splash-card">
          <div class="splash-card-inner">
            <h1 class="splash-name">Arya <span>Mitra</span></h1>
            <p class="splash-tagline">Hnrs CS + Math @ UMass Amherst</p>
            <p class="splash-email">contact@aryamitra.me</p>
          </div>
        </div>

        <nav class="splash-links" aria-label="Elsewhere">
            <a href="https://github.com/aryamitra" target="_blank" rel="noopener">github</a>
            <a href="https://www.linkedin.com/in/arya-mitra-22b522359/" target="_blank" rel="noopener">linkedin</a>
        </nav>

        <a class="splash-enter" href="/portfolio/">Proceed to main site <span class="arrow" aria-hidden="true">→</span></a>
    </main>

    <!-- The card that actually flips. It is laid out at full viewport size and starts
         scaled down onto .splash-card, so the browser rasterizes it at its final size
         and shrinks it (sharp) instead of magnifying a card-sized bitmap (blurry). -->
    <div class="flip-stage" aria-hidden="true">
      <div class="flip-card">
        <!-- Back of the card: the live portfolio, loaded now so it is ready when the card flips -->
        <div class="flip-back">
          <iframe src="/portfolio/" title="" tabindex="-1"></iframe>
        </div>
        <div class="flip-front"></div>
      </div>
    </div>

    <script src="/assets/js/splash.js?v=636e33ad"></script>
</body>
</html>
